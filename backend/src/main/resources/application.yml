spring:
  application:
    name: manufactureos
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/manufactureos}
    username: ${DATABASE_USERNAME:manufactureos}
    password: ${DATABASE_PASSWORD:manufactureos}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never

manufactureos:
  jwt:
    secret: ${JWT_SECRET}
    access-ttl-minutes: 15
    refresh-ttl-days: 7
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  scrap:
    approval-threshold: 50
  password-reset:
    ttl-minutes: 30
  seed:
    enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
